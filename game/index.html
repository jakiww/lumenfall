<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23ffbe50'/%3E%3C/svg%3E">
<title>LUMENFALL — The Last Lumen Keeper</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #05060a;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  #wrap {
    position: relative;
    line-height: 0;
  }
  canvas {
    display: block;
    width: 1280px;
    height: 800px;
    max-width: 100vw;
    max-height: 100vh;
    background: #07080f;
    cursor: crosshair;
    border-radius: 4px;
    box-shadow: 0 0 60px rgba(255, 190, 80, 0.12), 0 0 120px rgba(40, 180, 200, 0.08);
  }
  #hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: -26px;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: #5a6478;
    line-height: 1.4;
    user-select: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
  <div id="hint">WASD / ARROWS MOVE &nbsp;·&nbsp; MOUSE AIM &nbsp;·&nbsp; CLICK HOLD TO SHOOT &nbsp;·&nbsp; SPACE DASH &nbsp;·&nbsp; P PAUSE &nbsp;·&nbsp; M MUTE</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
